name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run local checkpoints
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: "fake://"
        run: pytest tests/ --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py -m "not docker" -v

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t day12-agent:ci .

  deploy:
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK" || { echo "Missing RENDER_DEPLOY_HOOK secret"; exit 1; }
          test -n "$PUBLIC_URL" || { echo "Missing PUBLIC_URL repository variable"; exit 1; }
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK"
      - name: Smoke test Render health
        run: |
          sleep 45
          curl -fsS "${{ vars.PUBLIC_URL }}/health"
